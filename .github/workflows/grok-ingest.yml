name: grok-ingest

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.GROK_INGEST_ENABLED == 'true'
    uses: ./.github/workflows/rss-ingest.yml
    with:
      sopilot_batch_id: ""
      ingest_lane: grok
    secrets: inherit
